<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">Schematische doorsnede van een afvoerleiding</title>
  <desc id="d">Links een schone leiding met volledige doorgang. Rechts dezelfde leiding met een laag urinesteen langs de binnenwand, waardoor de vrije doorgang veel kleiner is.</desc>
  <defs>
    <pattern id="steen" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="10" height="10" fill="#C9A66B"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#A9864D" stroke-width="4"/>
    </pattern>
  </defs>
  <rect width="640" height="380" fill="#FFFFFF"/>

  <!-- Schone leiding -->
  <g transform="translate(160 175)">
    <circle r="112" fill="#8A97A8"/>
    <circle r="96" fill="#DCEBF7"/>
    <text y="8" text-anchor="middle" font-size="22" font-weight="700" fill="#0C2D57">vrije doorgang</text>
  </g>
  <text x="160" y="335" text-anchor="middle" font-size="24" font-weight="800" fill="#0C2D57">Schone leiding</text>

  <!-- Leiding met urinesteen -->
  <g transform="translate(480 175)">
    <circle r="112" fill="#8A97A8"/>
    <circle r="96" fill="url(#steen)"/>
    <path d="M0 -96 A96 96 0 0 1 0 96 A96 96 0 0 1 0 -96 Z" fill="none" stroke="#8E6E3A" stroke-width="2"/>
    <ellipse cx="6" cy="-8" rx="40" ry="34" fill="#DCEBF7" stroke="#8E6E3A" stroke-width="2"/>
  </g>
  <text x="480" y="335" text-anchor="middle" font-size="24" font-weight="800" fill="#0C2D57">Met urinesteen</text>

  <!-- Labels rechts -->
  <g font-size="19" fill="#1A2433">
    <line x1="486" y1="167" x2="560" y2="52" stroke="#1A2433" stroke-width="2"/>
    <circle cx="486" cy="167" r="4" fill="#1A2433"/>
    <text x="620" y="44" text-anchor="end" font-weight="700">restopening</text>
    <line x1="420" y1="120" x2="350" y2="52" stroke="#1A2433" stroke-width="2"/>
    <circle cx="420" cy="120" r="4" fill="#1A2433"/>
    <text x="270" y="46" font-weight="700">laag urinesteen</text>
  </g>

  <text x="20" y="368" font-size="15" fill="#4A5568">Schematische weergave, niet op schaal</text>
</svg>
