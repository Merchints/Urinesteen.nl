<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">Zo werkt een vacuümtoilet</title>
  <desc id="d">Een vacuümtoilet met een afvoerklep. Bij het spoelen opent de klep kort. Door de onderdruk in de vacuümleiding worden inhoud en lucht naar de vacuümunit met verzameltank gezogen.</desc>
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#157A43"/></marker>
  </defs>
  <rect width="600" height="330" fill="#FFFFFF"/>
  <!-- Toilet -->
  <path d="M40 120 h96 v26 q0 44 -48 52 q-48 -8 -48 -52 z" fill="#fff" stroke="#5E6C7E" stroke-width="3"/>
  <rect x="34" y="108" width="108" height="14" rx="6" fill="#D5DCE4"/>
  <!-- Klep -->
  <rect x="74" y="196" width="28" height="18" fill="#8A97A8"/>
  <rect x="70" y="214" width="36" height="30" rx="4" fill="#0C2D57"/>
  <text x="88" y="234" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">klep</text>
  <!-- Leiding -->
  <path d="M88 244 V270 H440" fill="none" stroke="#8A97A8" stroke-width="22" stroke-linejoin="round"/>
  <path d="M88 244 V270 H440" fill="none" stroke="#E6EDF5" stroke-width="12" stroke-linejoin="round"/>
  <path d="M200 264 H300 M210 277 H330" stroke="#C9A66B" stroke-width="4"/>
  <path d="M150 270 H230" stroke="#157A43" stroke-width="4" marker-end="url(#flow)"/>
  <path d="M340 270 H420" stroke="#157A43" stroke-width="4" marker-end="url(#flow)"/>
  <!-- Vacuümunit -->
  <rect x="440" y="196" width="140" height="110" rx="10" fill="#E2E8F0" stroke="#8A97A8" stroke-width="3"/>
  <text x="510" y="240" text-anchor="middle" font-size="17" font-weight="800" fill="#0C2D57">vacuümunit</text>
  <text x="510" y="262" text-anchor="middle" font-size="15" fill="#4A5568">pomp en</text>
  <text x="510" y="282" text-anchor="middle" font-size="15" fill="#4A5568">verzameltank</text>
  <!-- Labels -->
  <g font-size="17" fill="#0C2D57">
    <text x="170" y="120" font-weight="800">1  Spoelen</text>
    <text x="170" y="142">de klep opent kort</text>
    <text x="170" y="186" font-weight="800">2  Onderdruk</text>
    <text x="170" y="208">zuigt inhoud en lucht mee</text>
    <text x="200" y="316">vacuümleiding: aanslag ontstaat langs de wand</text>
  </g>
  <text x="588" y="24" text-anchor="end" font-size="13" fill="#4A5568">Schematische weergave</text>
</svg>
