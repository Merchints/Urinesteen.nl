<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">Principe van de maritieme doseerunit</title>
  <desc id="d">Aan het einde van de hoofdvacuümleiding staat een doseerunit op een jerrycan ontkalkingsgel. De unit heeft twee kleppen: de ene voert gel toe aan de leiding, de andere laat op ingestelde momenten lucht toe. Die luchtpuls neemt de gel mee langs de binnenwand, langs de aansluitingen van de toiletten, richting de vacuümunit.</desc>
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#157A43"/></marker>
    <marker id="air" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3E8ED0"/></marker>
  </defs>
  <rect width="600" height="470" fill="#FFFFFF"/>

  <!-- Hoofdvacuümleiding -->
  <rect x="96" y="236" width="410" height="36" rx="18" fill="#8A97A8"/>
  <rect x="101" y="241" width="400" height="26" rx="13" fill="#E6EDF5"/>
  <path d="M110 263 H490" stroke="#1FA55B" stroke-width="5" stroke-linecap="round" opacity=".75"/>
  <path d="M110 245 H300" stroke="#1FA55B" stroke-width="3" stroke-linecap="round" opacity=".5"/>

  <!-- Toiletaansluitingen -->
  <g>
    <rect x="234" y="170" width="14" height="68" fill="#8A97A8"/>
    <rect x="324" y="170" width="14" height="68" fill="#8A97A8"/>
    <rect x="414" y="170" width="14" height="68" fill="#8A97A8"/>
    <g fill="#fff" stroke="#5E6C7E" stroke-width="3">
      <path d="M218 132 h46 v20 q0 20 -23 24 q-23 -4 -23 -24 z"/>
      <path d="M308 132 h46 v20 q0 20 -23 24 q-23 -4 -23 -24 z"/>
      <path d="M398 132 h46 v20 q0 20 -23 24 q-23 -4 -23 -24 z"/>
    </g>
  </g>
  <text x="331" y="116" text-anchor="middle" font-size="17" fill="#4A5568">vacuümtoiletten op de leiding</text>

  <!-- Vacuümunit -->
  <rect x="506" y="214" width="84" height="80" rx="10" fill="#E2E8F0" stroke="#8A97A8" stroke-width="3"/>
  <text x="548" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#0C2D57">vacuüm-</text>
  <text x="548" y="270" text-anchor="middle" font-size="16" font-weight="700" fill="#0C2D57">unit</text>

  <!-- Doseerunit op jerrycan -->
  <rect x="14" y="300" width="90" height="110" rx="10" fill="#F4F6F8" stroke="#8A97A8" stroke-width="3"/>
  <text x="59" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#0C2D57">gel</text>
  <rect x="20" y="214" width="34" height="56" rx="4" fill="#1A2433"/>
  <rect x="62" y="214" width="34" height="56" rx="4" fill="#1A2433"/>
  <rect x="26" y="222" width="22" height="10" rx="2" fill="#1FA55B"/>
  <rect x="68" y="222" width="22" height="10" rx="2" fill="#3E8ED0"/>
  <text x="37" y="258" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">G</text>
  <text x="79" y="258" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">L</text>
  <path d="M37 300 V270" stroke="#1FA55B" stroke-width="5"/>
  <path d="M54 252 H96" stroke="#1FA55B" stroke-width="5"/>
  <path d="M79 190 V214" stroke="#3E8ED0" stroke-width="4" marker-end="url(#air)"/>
  <text x="79" y="180" text-anchor="middle" font-size="15" fill="#3E8ED0" font-weight="700">lucht</text>

  <!-- Transport -->
  <path d="M150 254 H200" stroke="#3E8ED0" stroke-width="4" marker-end="url(#air)"/>
  <path d="M440 254 H490" stroke="#3E8ED0" stroke-width="4" marker-end="url(#air)"/>

  <!-- Legenda -->
  <g font-size="17" fill="#1A2433">
    <rect x="140" y="320" width="22" height="16" rx="3" fill="#1FA55B"/>
    <text x="172" y="334"><tspan font-weight="800">G</tspan> klep voert ontkalkingsgel toe</text>
    <rect x="140" y="350" width="22" height="16" rx="3" fill="#3E8ED0"/>
    <text x="172" y="364"><tspan font-weight="800">L</tspan> klep laat lucht toe: de luchtpuls</text>
    <path d="M140 394 H162" stroke="#3E8ED0" stroke-width="4" marker-end="url(#air)"/>
    <text x="172" y="400">luchtpuls neemt de gel mee door de leiding</text>
    <path d="M140 424 H162" stroke="#1FA55B" stroke-width="5"/>
    <text x="172" y="430">gel hecht aan de binnenwand</text>
  </g>
  <text x="14" y="160" font-size="15" font-weight="700" fill="#0C2D57">einde hoofdleiding</text>
  <text x="588" y="460" text-anchor="end" font-size="13" fill="#4A5568">Schematische weergave</text>
</svg>
