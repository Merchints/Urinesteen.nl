<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">Behandelen per verdieping via de standleiding</title>
  <desc id="d">Twee verdiepingen boven elkaar. Op elke verdieping loopt de afvoer van een urinoir naar dezelfde verticale standleiding. Stap 1 is de onderste verdieping, stap 2 de verdieping erboven. Groene pijlen tonen dat het water vanuit het urinoir naar de standleiding stroomt en daarin naar beneden.</desc>
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#157A43"/></marker>
    <marker id="work" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0C2D57"/></marker>
    <symbol id="urinoir" viewBox="-40 -40 80 210" overflow="visible">
      <path d="M0 -36 v30" stroke="#8A97A8" stroke-width="6"/>
      <path d="M-28 -6 Q-38 -6 -38 6 L-38 80 Q-38 124 0 130 Q38 124 38 80 L38 6 Q38 -6 28 -6 Z" fill="#fff" stroke="#5E6C7E" stroke-width="3"/>
      <path d="M-24 22 Q-24 12 -14 12 L14 12 Q24 12 24 22 L24 80 Q24 108 0 113 Q-24 108 -24 80 Z" fill="#EEF3F9" stroke="#B8C2CF" stroke-width="2"/>
    </symbol>
  </defs>
  <rect width="560" height="600" fill="#FFFFFF"/>

  <!-- Vloeren -->
  <rect x="0" y="262" width="560" height="16" fill="#D5DCE4"/>
  <rect x="0" y="492" width="560" height="16" fill="#D5DCE4"/>
  <text x="548" y="254" text-anchor="end" font-size="15" fill="#4A5568">vloer</text>

  <!-- Standleiding -->
  <rect x="392" y="10" width="30" height="560" fill="#8A97A8"/>
  <rect x="398" y="10" width="18" height="560" fill="#E6EDF5"/>
  <rect x="398" y="300" width="5" height="270" fill="#C9A66B"/>
  <rect x="411" y="330" width="5" height="240" fill="#C9A66B"/>
  <text x="436" y="60" font-size="20" font-weight="800" fill="#0C2D57">Stand-</text>
  <text x="436" y="84" font-size="20" font-weight="800" fill="#0C2D57">leiding</text>

  <!-- Bovenste verdieping -->
  <use href="#urinoir" x="200" y="88" width="80" height="210"/>
  <path d="M240 222 V238 L392 250" fill="none" stroke="#8A97A8" stroke-width="14" stroke-linejoin="round"/>
  <path d="M240 222 V238 L392 250" fill="none" stroke="#E6EDF5" stroke-width="7" stroke-linejoin="round"/>
  <path d="M262 240 L330 245" stroke="#157A43" stroke-width="4" marker-end="url(#flow)"/>

  <!-- Onderste verdieping -->
  <use href="#urinoir" x="200" y="318" width="80" height="210"/>
  <path d="M240 452 V468 L392 480" fill="none" stroke="#8A97A8" stroke-width="14" stroke-linejoin="round"/>
  <path d="M240 452 V468 L392 480" fill="none" stroke="#E6EDF5" stroke-width="7" stroke-linejoin="round"/>
  <path d="M262 470 L330 475" stroke="#157A43" stroke-width="4" marker-end="url(#flow)"/>
  <path d="M300 474 L380 480" stroke="#C9A66B" stroke-width="3"/>

  <!-- Stroomrichting in de standleiding -->
  <path d="M407 270 V330" stroke="#157A43" stroke-width="4" marker-end="url(#flow)"/>
  <path d="M407 500 V556" stroke="#157A43" stroke-width="4" marker-end="url(#flow)"/>

  <!-- Stappen -->
  <g font-weight="800">
    <rect x="16" y="130" width="112" height="44" rx="22" fill="#0C2D57"/>
    <text x="72" y="160" text-anchor="middle" font-size="20" fill="#fff">Stap 2</text>
    <rect x="16" y="360" width="112" height="44" rx="22" fill="#0C2D57"/>
    <text x="72" y="390" text-anchor="middle" font-size="20" fill="#fff">Stap 1</text>
  </g>
  <path d="M72 352 V190" stroke="#0C2D57" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#work)"/>

  <!-- Legenda -->
  <g font-size="17" fill="#1A2433">
    <path d="M20 540 H62" stroke="#157A43" stroke-width="4" marker-end="url(#flow)"/>
    <text x="76" y="546">stroomrichting van het water</text>
    <path d="M20 576 H62" stroke="#0C2D57" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#work)"/>
    <text x="76" y="582">volgorde van behandelen</text>
  </g>
  <text x="548" y="590" text-anchor="end" font-size="13" fill="#4A5568">Schematische weergave</text>
</svg>
