<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">Drie plekken waar urinesteen kan zitten</title>
  <desc id="d">Drie urinoirs naast elkaar aan een wand. Plek 1 is zichtbare aanslag op het keramiek, plek 2 is de sifon direct onder het urinoir, plek 3 is de gezamenlijke afvoerleiding achter de urinoirs.</desc>
  <defs>
    <pattern id="st" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="8" height="8" fill="#C9A66B"/><line x1="0" y1="0" x2="0" y2="8" stroke="#A9864D" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="640" height="420" fill="#FFFFFF"/>
  <!-- Wand -->
  <rect x="0" y="0" width="640" height="300" fill="#EEF3F9"/>
  <rect x="0" y="300" width="640" height="120" fill="#E2E8F0"/>

  <!-- Gezamenlijke leiding (achter de wand, gestippeld kader) -->
  <rect x="40" y="262" width="560" height="26" rx="13" fill="#8A97A8"/>
  <rect x="44" y="266" width="552" height="18" rx="9" fill="#DCEBF7"/>
  <rect x="300" y="276" width="296" height="8" fill="url(#st)"/>
  <path d="M596 275 h30" stroke="#8A97A8" stroke-width="22"/>

  <!-- Drie urinoirs -->
  <defs><g id="u">
    <path d="M0 30 v40" stroke="#8A97A8" stroke-width="6"/>
    <circle cx="0" cy="34" r="8" fill="#B8C2CF"/>
    <path d="M-28 66 Q-38 66 -38 78 L-38 150 Q-38 194 0 200 Q38 194 38 150 L38 78 Q38 66 28 66 Z" fill="#FFFFFF" stroke="#8A97A8" stroke-width="3"/>
    <path d="M-24 96 Q-24 86 -14 86 L14 86 Q24 86 24 96 L24 150 Q24 178 0 183 Q-24 178 -24 150 Z" fill="#F3F6FA" stroke="#B8C2CF" stroke-width="2"/>
    <rect x="-6" y="198" width="12" height="10" fill="#8A97A8"/>
    <!-- sifon -->
    <path d="M0 206 v22 a14 14 0 0 0 28 0 v-8" fill="none" stroke="#8A97A8" stroke-width="12"/>
    <path d="M28 222 v40" stroke="#8A97A8" stroke-width="12"/>
  </g></defs>
  <use href="#u" x="140"/>
  <use href="#u" x="320"/>
  <use href="#u" x="500"/>
  <!-- aanslag in sifon van middelste urinoir -->
  <path d="M320 222 a14 14 0 0 0 28 0" fill="none" stroke="url(#st)" stroke-width="7"/>
  <!-- aanslag op keramiek links -->
  <path d="M120 178 q20 14 40 0" fill="none" stroke="#C9A66B" stroke-width="6" stroke-linecap="round"/>

  <!-- Labels -->
  <g font-weight="800" font-size="20">
    <circle cx="96" cy="196" r="17" fill="#157A43"/><text x="96" y="203" text-anchor="middle" fill="#fff">1</text>
    <circle cx="372" cy="230" r="17" fill="#157A43"/><text x="372" y="237" text-anchor="middle" fill="#fff">2</text>
    <circle cx="460" cy="310" r="17" fill="#157A43"/><text x="460" y="317" text-anchor="middle" fill="#fff">3</text>
  </g>
  <g font-size="19" fill="#0C2D57" font-weight="700">
    <text x="24" y="352">1  Keramiek: zichtbare aanslag</text>
    <text x="24" y="380">2  Sifon: de bocht direct onder het urinoir</text>
    <text x="24" y="408">3  Gezamenlijke leiding achter meerdere urinoirs</text>
  </g>
  <text x="616" y="30" text-anchor="end" font-size="15" fill="#4A5568">Schematische weergave</text>
</svg>
