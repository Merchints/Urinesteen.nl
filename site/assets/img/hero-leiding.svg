<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">Doorsnede van een afvoerbuis met urinesteen</title>
  <desc id="d">Een afvoerbuis in doorsnede. Langs de binnenwand zit een onregelmatige laag urinesteen, onderin het dikst. In het midden blijft een kleine vrije doorgang over.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C7D0DB"/>
      <stop offset=".55" stop-color="#9AA7B7"/>
      <stop offset="1" stop-color="#6E7C8E"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4E9EF"/>
      <stop offset="1" stop-color="#AEB9C6"/>
    </linearGradient>
    <radialGradient id="deposit" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#E3C891"/>
      <stop offset=".7" stop-color="#CFA867"/>
      <stop offset="1" stop-color="#B48A4C"/>
    </radialGradient>
    <radialGradient id="hole" cx=".55" cy=".45" r=".6">
      <stop offset="0" stop-color="#04101F"/>
      <stop offset=".75" stop-color="#0B2547"/>
      <stop offset="1" stop-color="#1A3B66"/>
    </radialGradient>
    <pattern id="grain" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="1.6" fill="#9C7841" opacity=".45"/>
      <circle cx="10" cy="10" r="1.2" fill="#F3DEB0" opacity=".5"/>
      <circle cx="11" cy="3" r=".9" fill="#9C7841" opacity=".35"/>
    </pattern>
    <clipPath id="inner"><circle cx="230" cy="300" r="160"/></clipPath>
  </defs>

  <!-- Buislichaam (perspectief naar achteren) -->
  <circle cx="390" cy="180" r="170" fill="#5E6C7E"/>
  <polygon points="116,148 288,44 492,316 344,452" fill="url(#body)"/>
  <path d="M116 148 L288 44" stroke="#DDE3EA" stroke-width="2" opacity=".6"/>

  <!-- Snijvlak: buiswand -->
  <circle cx="230" cy="300" r="190" fill="url(#wall)"/>
  <circle cx="230" cy="300" r="190" fill="none" stroke="#7D8A9B" stroke-width="2"/>

  <!-- Urinesteen langs de binnenwand -->
  <g clip-path="url(#inner)">
    <circle cx="230" cy="300" r="160" fill="url(#deposit)"/>
    <circle cx="230" cy="300" r="160" fill="url(#grain)"/>
    <path d="M90 300 Q120 340 150 330 T210 360 T280 350 T350 330 T380 300" fill="none" stroke="#A07C44" stroke-width="2" opacity=".45"/>
    <path d="M110 250 Q140 230 150 200" fill="none" stroke="#A07C44" stroke-width="2" opacity=".35"/>
  </g>
  <circle cx="230" cy="300" r="160" fill="none" stroke="#8E95A0" stroke-width="3"/>

  <!-- Vrije doorgang: onregelmatige restopening -->
  <path d="M160 262 C158 214 196 182 240 180 C276 178 312 196 322 232 C330 262 318 290 296 306 C276 322 250 318 228 326 C204 334 178 322 168 300 C162 288 160 276 160 262 Z"
        fill="url(#hole)" stroke="#8C6A36" stroke-width="4"/>

  <!-- Aanduidingen -->
  <g stroke="#FFFFFF" stroke-width="2" fill="#FFFFFF">
    <line x1="214" y1="232" x2="108" y2="78"/><circle cx="214" cy="232" r="5"/>
    <line x1="292" y1="396" x2="374" y2="492"/><circle cx="292" cy="396" r="5"/>
  </g>
  <g fill="#FFFFFF" font-weight="700" font-size="26">
    <text x="16" y="66">Vrije doorgang</text>
    <text x="352" y="522">Urinesteen</text>
  </g>
</svg>
